name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: linux-amd64
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            artifact: linux-arm64
            goos: linux
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Build and test
        run: make test
      - name: Name release artifact
        run: cp build/model-list-tweaker.so build/model-list-tweaker-${{ matrix.artifact }}.so
      - name: Package Plugin Store archive
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          archive="model-list-tweaker_${version}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
          (cd build && zip "$archive" model-list-tweaker.so)
      - uses: actions/upload-artifact@v4
        with:
          name: model-list-tweaker-${{ matrix.artifact }}
          path: |
            build/model-list-tweaker-${{ matrix.artifact }}.so
            build/model-list-tweaker_*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: model-list-tweaker-*
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          sha256sum model-list-tweaker_*.zip > checksums.txt
          gh release create "$GITHUB_REF_NAME" \
            model-list-tweaker-linux-amd64.so \
            model-list-tweaker-linux-arm64.so \
            model-list-tweaker_*.zip \
            checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes
